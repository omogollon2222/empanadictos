<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C1315">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<title>Empanadictos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --carbon:#1C1315; --brasa:#D62839; --boton:#EE8E8A; --boton-hover:#E97C77; --boton-ink:#4A1016; --chispa:#FFC93C; --naranja:#F2762E; --masa:#F6E3B8; --pared:#E9B48E;
  --bg:#FBEEE2; --surface:#FFFFFF; --surface2:#FFF7EE; --ink:#2A1C1E; --muted:#7A6260; --line:#EBD5C4;
  --good:#2E9E62; --warn:#E0A800; --shadow:0 2px 0 rgba(28,19,21,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#170F11;--surface:#241A1C;--surface2:#2C2023;--ink:#FBEEE2;--muted:#BFA59C;--line:#3A2B2E;--shadow:none}
}
:root[data-theme="dark"]{--bg:#170F11;--surface:#241A1C;--surface2:#2C2023;--ink:#FBEEE2;--muted:#BFA59C;--line:#3A2B2E;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--chispa);outline-offset:2px}

header{background:radial-gradient(120% 140% at 50% 120%,rgba(214,40,57,.55) 0%,rgba(214,40,57,0) 60%),repeating-conic-gradient(from 0deg at 50% 110%,rgba(214,40,57,.18) 0deg 8deg,transparent 8deg 22deg),var(--carbon);color:#fff;padding:16px 16px 20px}
.brand{display:flex;align-items:center;gap:12px;max-width:820px;margin:0 auto}
.brand svg{flex:none;width:54px;height:40px}
.word{font-family:"Lilita One",Impact,sans-serif;font-size:clamp(26px,7.5vw,40px);line-height:1;letter-spacing:.5px;background:linear-gradient(180deg,#FFE58A 0%,var(--chispa) 35%,var(--naranja) 65%,var(--brasa) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.tag{font-family:Pacifico,cursive;font-size:14px;color:#FFE9C7;margin-top:2px}
.hright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sync{font-size:11px;color:#E9CFC0;text-align:right}
.brand>div:nth-child(2){min-width:0;flex:1 1 auto}
.hright{min-width:0;flex:0 1 auto;max-width:48%}
.rolechip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sync{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:400px){.word{font-size:24px}.tag{font-size:12px}.brand{gap:8px}.brand svg{width:40px;height:30px}.rolechip{padding:7px 9px;font-size:12px}}
.gear{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;width:42px;height:42px;font-size:20px}

main{max-width:820px;margin:0 auto;padding:16px 16px 190px}
h2{font-family:"Lilita One",Impact,sans-serif;font-weight:400;font-size:24px;margin:10px 0 12px;letter-spacing:.3px}
h3{font-size:17px;font-weight:800;margin:0 0 10px}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 14px}
small.m{color:var(--muted);font-weight:600}

.cmdbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;margin-bottom:12px;border:2px solid var(--line);background:var(--surface)}
.cmdbar.on{border-color:#7BC47F;background:rgba(62,155,71,.12)}.cmdbar.off{background:rgba(128,110,100,.10)}
.cmdtxt{flex:1;display:flex;flex-direction:column;gap:2px}.cmdtxt small{color:var(--muted);font-size:12.5px}
.switch{width:56px;height:32px;border-radius:16px;border:0;background:#C9BDB6;position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch[aria-checked="true"]{background:#3E9B47}.switch[aria-checked="true"] i{left:28px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--carbon);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav.tabs[hidden],.paybar[hidden],nav.tabs button[hidden],nav.tabs .pill[hidden]{display:none}
nav.tabs button{flex:1;max-width:150px;background:none;border:0;color:#CDB5AC;padding:7px 2px;border-radius:14px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .ic{font-size:21px;line-height:1}
nav.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#F3A29E,var(--boton));color:var(--boton-ink)}
nav.tabs .pill{position:absolute;top:2px;right:calc(50% - 22px);background:var(--chispa);color:var(--carbon);font-size:11px;font-weight:800;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.cell{position:relative}
.tile{width:100%;position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 12px 12px;text-align:left;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .08s}
.tile.small{min-height:98px;padding:12px}
.tile:active{transform:scale(.97)}
.tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.tile.out{opacity:.45}
.tile .dot{width:38px;height:28px}
.tile .name{font-weight:800;font-size:16px;line-height:1.15;margin-top:6px}
.tile .price{color:var(--muted);font-weight:700;font-size:14px}
.stock{font-size:12px;font-weight:800}
.stock.low{color:var(--brasa)}
.badge{position:absolute;top:10px;right:10px;min-width:36px;height:36px;border-radius:18px;background:var(--c);color:#fff;font-family:"Lilita One",sans-serif;font-size:20px;display:grid;place-items:center;padding:0 8px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.minus{position:absolute;bottom:10px;right:10px;width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);font-size:22px;font-weight:800;line-height:1;display:grid;place-items:center}

.paybar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;padding:0 10px}
.paybox{max-width:800px;margin:0 auto;background:var(--carbon);color:#fff;border-radius:22px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(28,19,21,.35)}
.paybox .tot{font-family:"Lilita One",sans-serif;font-size:28px;line-height:1;color:var(--chispa)}
.paybox .cnt{font-size:12px;color:#E9CFC0}
.seg{display:flex;background:#3A2A2D;border-radius:12px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;color:#E9CFC0;font-size:12px;font-weight:700;padding:7px 8px;border-radius:9px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--carbon)}
.cta{border:0;border-radius:16px;background:linear-gradient(180deg,var(--chispa),var(--naranja));color:var(--carbon);font-weight:800;font-size:16px;padding:14px 16px;white-space:nowrap}
.cta:disabled{opacity:.4}

.goal{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.goal .row{display:flex;justify-content:space-between;font-weight:700;font-size:14px;gap:8px}
.bar{height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--chispa),var(--naranja),var(--brasa))}

.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chips button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--carbon);border-color:var(--carbon);color:#fff}
.recs{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.rec{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:14px;background:var(--surface);border-left:8px solid var(--rc);box-shadow:var(--shadow)}
.rec .em{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.rec b{display:block;font-size:16px;line-height:1.25;margin-bottom:3px}
.rec p{margin:0;color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px}
.kpi .v{font-family:"Lilita One",sans-serif;font-size:27px;line-height:1.05}
.kpi .l{font-size:13px;color:var(--muted);font-weight:700}
.kpi .d{font-size:12px;font-weight:800;margin-top:4px}
.up{color:var(--good)} .down{color:var(--brasa)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px}
.hbar{display:grid;grid-template-columns:128px 1fr 74px;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.hbar .n{font-weight:700;line-height:1.1}
.hbar .t{height:22px;background:var(--surface2);border-radius:8px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:8px}
.hbar .x{text-align:right;font-weight:800}
.vchart{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:18px}
.vchart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vchart .col i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--pared);min-height:2px}
.vchart .col.peak i{background:linear-gradient(180deg,var(--chispa),var(--brasa))}
.vchart .col span{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
.vchart .col em{font-style:normal;font-size:10px;font-weight:800;margin-bottom:2px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.plan div{background:var(--surface2);border-radius:14px;padding:10px;text-align:center}
.plan .v{font-family:"Lilita One",sans-serif;font-size:30px;line-height:1}
.plan .l{font-size:13px;font-weight:700}
.list{display:flex;flex-direction:column}
.sale{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sale:last-child{border-bottom:0}
.sale .when{color:var(--muted);width:70px;flex:none;font-size:13px}
.sale .what{flex:1;min-width:0}
.sale .amt{font-weight:800}
.sale button{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.empty .big{font-size:44px}
.demo{background:var(--chispa);color:var(--carbon);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo button{border:0;background:var(--carbon);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}

/* Cocina */
.who{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.who span{font-weight:800;font-size:14px}
.kcols{display:grid;gap:14px}
@media (min-width:760px){.kcols{grid-template-columns:repeat(3,1fr)}}
.kcol h3{display:flex;align-items:center;gap:8px}
.kcol h3 .n{background:var(--carbon);color:#fff;border-radius:10px;padding:1px 9px;font-size:14px}
.ticket{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;border-top:8px solid var(--tc,var(--line))}
.ticket.ok{--tc:var(--good)} .ticket.mid{--tc:var(--warn)} .ticket.late{--tc:var(--brasa)}
.ticket .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ticket .num{font-family:"Lilita One",sans-serif;font-size:24px}
.ticket .clock{font-family:"Lilita One",sans-serif;font-size:22px;font-variant-numeric:tabular-nums}
.ticket.late .clock{color:var(--brasa)}
.ticket ul{margin:8px 0 10px;padding:0;list-style:none;font-size:17px;font-weight:700}
.ticket li{padding:2px 0}
.ticket li b{display:inline-block;min-width:30px}
.ticket .meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.ticket .go{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:16px;color:var(--boton-ink);background:var(--boton)}
.ticket .go.ready{background:var(--good)}
.ticket .go.deliver{background:var(--carbon)}

/* Inventario */
.inv{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.inv{grid-template-columns:repeat(2,1fr)}}
.invc{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;border-left:8px solid var(--c)}
.invc .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.invc .big{font-family:"Lilita One",sans-serif;font-size:40px;line-height:1}
.status{font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px;background:var(--surface2)}
.status.low{background:var(--brasa);color:#fff}
.status.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.status.zero{background:var(--carbon);color:#fff}
.invc .act{display:flex;gap:8px;margin-top:10px}
.invc .act input{flex:1;min-width:0}

.frow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.prow{display:grid;grid-template-columns:1fr 72px 72px;gap:8px;align-items:center;padding:10px 0 4px}
.prow input{width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px;font-weight:700;font-size:16px}
.pmeta{display:flex;align-items:center;gap:8px;padding:0 0 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:700}
.pmeta .sw{width:14px;height:14px;border-radius:50%;flex:none}
.pmeta button{margin-left:auto}
.prow.off input{opacity:.55}
.newprod{background:var(--surface2);border:2px dashed var(--line);border-radius:16px;padding:12px;margin-top:12px}
.newprod select,.newprod input[type=color]{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;font-weight:700;font-size:16px;min-height:46px}
.frow.head{font-size:12px;color:var(--muted);font-weight:800;border-bottom:2px solid var(--line)}
.frow input,.inp{width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;font-weight:700;font-size:16px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:800}
.btn.primary{background:var(--boton);border-color:var(--boton);color:var(--boton-ink)}
.btn.primary:hover,.ticket .go:hover{background:var(--boton-hover)}
.btn.dark{background:var(--carbon);border-color:var(--carbon);color:#fff}
.btn.danger{color:var(--brasa)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px}
.diff{font-family:"Lilita One",sans-serif;font-size:34px;line-height:1.1}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);padding:6px 4px;border-bottom:2px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.daynav b{flex:1;text-align:center;font-size:17px}
.daynav button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:18px}
.closed{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:var(--good)}
.login{max-width:420px;margin:10px auto 0}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.role{border:3px solid var(--line);background:var(--surface);border-radius:22px;padding:18px 10px;text-align:center;font-weight:800;font-size:17px}
.role .e{font-size:40px;display:block;margin-bottom:4px}
.role[aria-pressed="true"]{border-color:var(--brasa);background:color-mix(in srgb,var(--brasa) 10%,var(--surface))}
.pin{font-family:"Lilita One",sans-serif;font-size:32px;letter-spacing:10px;text-align:center}
.err{color:var(--brasa);font-weight:800;font-size:14px;min-height:20px;margin:8px 0}
.rolechip{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;white-space:nowrap}
body.kitchen main{max-width:1200px;padding-bottom:40px}
body.kitchen .ticket ul{font-size:20px}
.people{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:2px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-weight:700;font-size:14px}
.person .r{font-size:11px;font-weight:800;border-radius:8px;padding:2px 6px;background:var(--carbon);color:#fff}
.person .r.caj{background:var(--pared);color:var(--carbon)}
.person button{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 6px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:140px}
.addrow select{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;font-weight:700}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.names button{border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 8px;font-weight:800;font-size:16px}
.names small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.modal{position:fixed;inset:0;z-index:60;background:rgba(28,19,21,.72);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.modal[hidden]{display:none}
.mbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--carbon);color:#fff}
.mbar b{flex:1;font-size:15px}
.mbar .cta{padding:10px 14px;font-size:14px}
.mbar .x{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:10px 12px;font-weight:800}
.mbody{flex:1;overflow:auto;padding:14px 10px 30px}
.mpage{max-width:820px;margin:0 auto;background:#fff;border-radius:10px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.shift{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.shift:last-child{border-bottom:0}
.shift .nm{flex:1;min-width:0}
.shift .hh{font-weight:800;white-space:nowrap}
.live{display:inline-block;background:var(--good);color:#fff;border-radius:8px;font-size:11px;font-weight:800;padding:1px 6px;margin-left:4px}
.accts{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scroll-snap-type:x proximity}
.acc{flex:none;scroll-snap-align:start;min-width:128px;text-align:left;border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 12px;font-weight:800;font-size:15px;line-height:1.2;position:relative}

<script>
const BASE_PRODUCTS=[
  {id:"ranchera",name:"Ranchera",c:"#D62839",k:"emp"},
  {id:"pork",name:"Pulled Pork",c:"#7B2D26",k:"emp"},
  {id:"hawaiana",name:"Hawaiana",c:"#F2762E",k:"emp"},
  {id:"queso",name:"Queso",c:"#E0A800",k:"emp"},
  {id:"pollo",name:"Pollo y Champiñones",c:"#A8744A",k:"emp"},
  {id:"jamaica",name:"Jamaica con piña",c:"#A0204C",k:"beb"},
  {id:"limonada",name:"Limonada",c:"#B5B82A",k:"beb"},
  {id:"coca",name:"Coca-Cola personal",c:"#B0161F",k:"beb"},
  {id:"aguasin",name:"Agua sin gas personal",c:"#5E9CC0",k:"beb"},
  {id:"aguacon",name:"Agua con gas personal",c:"#3F7597",k:"beb"}
];
const BASE_IDS=new Set(BASE_PRODUCTS.map(p=>p.id));
let PRODUCTS=BASE_PRODUCTS.map(p=>({...p})), VIS=[], EMP=[], BEB=[], OTR=[];
// Todos los productos (incluidos los ocultos) sirven para el historial; VIS/EMP/BEB/OTR solo los visibles para vender.
function setProducts(list){PRODUCTS=list;VIS=list.filter(p=>!p.hidden);EMP=VIS.filter(p=>p.k==="emp");BEB=VIS.filter(p=>p.k==="beb");OTR=VIS.filter(p=>p.k==="otro")}
setProducts(PRODUCTS);
const DEFAULT_CONFIG={
  prices:{ranchera:1.5,pork:1.75,hawaiana:1.5,queso:1.25,pollo:1.5,jamaica:1.5,limonada:1.5,coca:1.5,aguasin:1.5,aguacon:1.5},
  costs:{ranchera:.6,pork:.75,hawaiana:.6,queso:.45,pollo:.6,jamaica:.4,limonada:.35,coca:.8,aguasin:.5,aguacon:.6},
  goal:80, staff:[{name:"Administrador",rol:"admin"}], cooks:["Cocinero 1","Cocinero 2"], target:8, stockMax:50, products:BASE_PRODUCTS.map(p=>({...p})),
  mins:{ranchera:10,pork:10,hawaiana:10,queso:10,pollo:10,jamaica:6,limonada:6,coca:6,aguasin:6,aguacon:6}, alertPhone:"", alertHour:"15:00", comanda:true
};
const LS="empanadictos_v2";
let config=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
let sales=[], cierres={}, inv={base:Object.fromEntries(PRODUCTS.map(p=>[p.id,50])),since:0};
let demo=false, demoSales=null;
let tab="vender", period="hoy", cart={}, pay="efectivo", client="", cajaDay=null;
let perdidas=[];
// Lee montos escritos con coma o punto (teclados de celular en español)
function numIn(v){v=String(v??"").replace(/[^\d.,-]/g,"");const i=Math.max(v.lastIndexOf(","),v.lastIndexOf("."));if(i>=0)v=v.slice(0,i).replace(/[.,]/g,"")+"."+v.slice(i+1).replace(/[.,]/g,"");const n=parseFloat(v);return isNaN(n)?NaN:n}
const DEC_IDS=["fondo","contado","recv","goal"];let cajaDraft={};
let addProd=false, xlsxFile=null;
let cuentas=[], acct=null, charging=false, newAcct=false, received="", shareFile=null, askRes=null;
let turnos=[], shiftId=null, demoShifts=null;
let who=null, pendingRole=null, role=null, claves=null, clavesLoaded=false, loginRole="ventas", fails=0, lockUntil=0;
let myCook=null; try{myCook=localStorage.getItem("emp_cook")}catch(e){}
let db=null, dl=null, loaded=false, seenPending=null;
let authNeeded=false, authUser=null, authBusy=false;

/* ---------- Almacenamiento ---------- */
function mergeCfg(c){c=c||{};const r=mergeCfg0(c);r.products=Array.isArray(c.products)&&c.products.length?c.products.map(p=>({id:String(p.id),name:String(p.name||p.id),c:p.c||"#999999",k:["emp","beb","otro"].includes(p.k)?p.k:"otro",hidden:!!p.hidden})):BASE_PRODUCTS.map(p=>({...p}));setProducts(r.products);return r}
function mergeCfg0(c){return{prices:{...DEFAULT_CONFIG.prices,...(c.prices||{})},costs:{...DEFAULT_CONFIG.costs,...(c.costs||{})},goal:Number(c.goal)||DEFAULT_CONFIG.goal,cooks:Array.isArray(c.cooks)&&c.cooks.length?c.cooks:DEFAULT_CONFIG.cooks,staff:Array.isArray(c.staff)&&c.staff.length?c.staff:DEFAULT_CONFIG.staff,target:Number(c.target)||DEFAULT_CONFIG.target,stockMax:Number(c.stockMax)||50,mins:{...DEFAULT_CONFIG.mins,...(c.mins||{})},alertPhone:String(c.alertPhone||""),alertHour:typeof c.alertHour==="string"?c.alertHour:DEFAULT_CONFIG.alertHour,comanda:c.comanda!==false}}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s){config=mergeCfg(s.config);sales=s.sales||[];cierres=s.cierres||{};if(s.inv)inv=s.inv;if(s.claves)claves=s.claves;if(s.turnos)turnos=s.turnos;if(s.cuentas)cuentas=s.cuentas;if(s.perdidas)perdidas=s.perdidas;}}catch(e){}}
function saveLocal(){if(db)return;try{localStorage.setItem(LS,JSON.stringify({config,sales,cierres,inv,claves,turnos,cuentas,perdidas}))}catch(e){}}
loadLocal();
window.addEventListener("storage",e=>{if(db||e.key!==LS)return;const pend=seenPending;loadLocal();if(acct&&!cuentas.some(c=>c.id===acct&&c.status==="abierta")){acct=null;charging=false}notifyNew();restoreSession();if(!(tab==="vender"&&document.activeElement&&document.activeElement.tagName==="INPUT"))render()});

(async()=>{
  await new Promise(r=>setTimeout(r,0));
  try{
    let d=null;
    if(window.claude&&window.claude.use){
      const [cd,dd]=await Promise.all([window.claude.use("db"),window.claude.use("downloads")]);
      d=cd; dl=dd;
    }else if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&!window.firebase){
      /* Hay nube configurada pero no cargó: no trabajar en modo local para no separar datos */
      $("#app").innerHTML=`<div class="empty"><div class="big">📡</div><p><b>Sin conexión con la nube.</b><br>Revisa el internet y vuelve a intentar.</p><button class="btn primary" onclick="location.reload()">Reintentar</button></div>`;
      $("#sync").textContent="Sin conexión";return;
    }else if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&window.firebase){
      /* Versión GitHub Pages: sincroniza caja y cocina con Firebase Firestore */
      if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
      /* Seguridad: nadie ve ni cambia datos sin iniciar sesión */
      authNeeded=true; clavesLoaded=true; $("#sync").textContent="🔒 Protegido"; render();
      await new Promise(res=>{let first=true;firebase.auth().onAuthStateChanged(u=>{
        authUser=u;
        if(u){if(first){first=false;res(u)}}
        else if(!first){location.reload()}
        else{render()}
      })});
      clavesLoaded=false; claves=null; render();
      d=firebase.firestore();
    }
    if(!d){clavesLoaded=true;restoreSession();render();return}
    db=d; sales=[]; cierres={}; claves=null; turnos=[]; cuentas=[]; perdidas=[];
    db.doc("tienda/claves").onSnapshot(s=>{claves=s.exists?s.data():null;clavesLoaded=true;restoreSession();render()},()=>{clavesLoaded=true;render()});
    $("#sync").textContent=authUser?"🔒 "+authUser.email:"Guardado en la nube";
    db.collection("ventas").where("t",">=",dayStart()-62*DAY).orderBy("t","desc").onSnapshot(snap=>{
      sales=snap.docs.map(x=>({id:x.id,...x.data()}));
      notifyNew(); loaded=true; render();
    },()=>{$("#sync").textContent="Sin conexión"});
    db.doc("tienda/config").onSnapshot(s=>{if(s.exists){config=mergeCfg(s.data());render()}},()=>{});
    db.doc("tienda/inventario").onSnapshot(s=>{if(s.exists){const v=s.data();inv={base:{...inv.base,...(v.base||{})},since:v.since||0};render()}},()=>{});
    db.collection("perdidas").orderBy("t","desc").limit(1000).onSnapshot(snap=>{perdidas=snap.docs.map(x=>({id:x.id,...x.data()}));if(role==="ventas"&&tab!=="vender")render()},()=>{});
    db.collection("cuentas").orderBy("tOpen","desc").limit(300).onSnapshot(snap=>{cuentas=snap.docs.map(x=>({id:x.id,...x.data()}));if(acct&&!cuentas.some(c=>c.id===acct&&c.status==="abierta")){acct=null;charging=false}if(role==="ventas")render()},()=>{});
    db.collection("turnos").orderBy("tIn","desc").limit(500).onSnapshot(snap=>{turnos=snap.docs.map(x=>({id:x.id,...x.data()}));if(role&&(tab==="caja"||tab==="analisis"||tab==="cocina"))render()},()=>{});
    db.collection("cierres").onSnapshot(snap=>{cierres={};snap.docs.forEach(x=>cierres[x.id]=x.data());if(tab==="caja")render()},()=>{});
  }catch(e){clavesLoaded=true;restoreSession();render()}
})();

/* ---------- Claves y roles ---------- */
async function hashPin(r,pin){
  const txt="empanadictos|"+r+"|"+pin;
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h1=5381;for(const c of txt)h1=((h1<<5)+h1+c.charCodeAt(0))|0;return "s"+(h1>>>0).toString(16)}
}
function restoreSession(){
  let s=null;try{s=JSON.parse(ssGet()||"null")}catch(e){}
  if(s&&s.who&&claves&&claves[s.role]&&claves[s.role]===s.h){if(role!==s.role){role=s.role;tab=role==="cocina"?"cocina":"vender";seenPending=null}who=s.who;shiftId=s.shift||null;if(role==="cocina"&&!myCook)myCook=who}
  else{ if(s&&claves&&s.shift){endShift(s.shift);try{ssDel()}catch(e){}} if(role){role=null;who=null;shiftId=null} }
}
function ssGet(){try{return sessionStorage.getItem("emp_session")}catch(e){return null}}
function ssSet(v){try{sessionStorage.setItem("emp_session",v)}catch(e){}}
function ssDel(){try{sessionStorage.removeItem("emp_session")}catch(e){}}
function isAdmin(){return role==="ventas"&&config.staff.some(s=>s.name===who&&s.rol==="admin")}
function persistSession(){try{ssSet(JSON.stringify({role,h:claves[role],who,shift:shiftId}))}catch(e){}}
function setSession(r,name,keepShift){role=r;who=name;pendingRole=null;tab=r==="cocina"?"cocina":"vender";if(r==="cocina"){myCook=name;try{localStorage.setItem("emp_cook",name)}catch(e){}}
  if(!keepShift){shiftId=null;startShift(r,name).then(id=>{shiftId=id;persistSession();render()}).catch(()=>{})}
  persistSession()}
async function startShift(r,name){
  const open=turnos.find(x=>x.name===name&&x.role===r&&!x.tOut&&Date.now()-x.tIn<16*36e5);if(open)return open.id;
  const t={name,role:r,rol:r==="cocina"?"Cocina":staffRol(name),tIn:Date.now(),tOut:null};
  if(db){const ref=await db.collection("turnos").add(t);return ref.id}
  t.id="t"+Date.now()+Math.random().toString(36).slice(2,5);turnos.unshift(t);saveLocal();return t.id}
async function endShift(id){if(!id)return;const p={tOut:Date.now()};
  try{if(db)await db.collection("turnos").doc(id).update(p);else{const t=turnos.find(x=>x.id===id);if(t&&!t.tOut)Object.assign(t,p);saveLocal()}}catch(e){}}

function genDemo(){
  let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const w={ranchera:.3,pork:.22,hawaiana:.16,queso:.08,pollo:.24};
  const bw={jamaica:.35,limonada:.25,coca:.2,aguasin:.12,aguacon:.08};
  const pick=o=>{let x=r(),acc=0;for(const k in o){acc+=o[k];if(x<=acc)return k}return Object.keys(o)[0]};
  const cooks=config.cooks.length?config.cooks:["Cocinero 1"];
  const out=[];const today=dayStart();
  for(let d=29;d>=0;d--){
    const base=today-d*DAY;const dow=new Date(base).getDay();
    const mult=dow===0?.6:dow===5||dow===6?1.4:1;
    const n=Math.round((18+r()*10)*mult);let num=0;
    for(let i=0;i<n;i++){
      const h=r()<.45?12+r()*2:r()<.6?17+r()*2.5:10+r()*10;
      const t=base+h*36e5;if(d===0&&t>Date.now())continue;
      const items={};const k=1+Math.floor(r()*r()*4);
      for(let j=0;j<k;j++){const f=pick(w);items[f]=(items[f]||0)+1}
      if(r()<.45){const b=pick(bw);items[b]=(items[b]||0)+1}
      const ci=Math.floor(r()*cooks.length);const speed=1+ci*.35;
      const wait=(20+r()*120)*1000*(h>12&&h<14?2:1), prep=(150+r()*240)*1000*speed;
      out.push({id:"d"+d+"_"+i,t,num:++num,items,total:Object.entries(items).reduce((a,[f,q])=>a+q*config.prices[f],0),pay:r()<.6?"efectivo":"transferencia",cashier:config.staff[Math.floor(r()*config.staff.length)].name,status:"entregado",cook:cooks[ci],tStart:t+wait,tReady:t+wait+prep,tDone:t+wait+prep+60000});
    }
  }
  return out.sort((a,b)=>b.t-a.t);
}

function projection(){

  const R=[];
  const lows=lowList();
  if(!demo&&lows.length) R.push({c:"var(--brasa)",e:"📦",t:"Queda poco: "+lows.map(p=>`${p.name} (${p.s})`).join(", "),p:"Hornea o repón antes de tu hora fuerte para no perder ventas."});
  if(!demo&&range0){const lb=lostBy(range0[0],range0[1]);const tot=Object.values(lb).reduce((a,b)=>a+b,0);
    if(tot){const top=Object.entries(lb).sort((a,b)=>b[1]-a[1])[0];R.push({c:"var(--brasa)",e:"🚫",t:`Perdiste ${tot} ${tot===1?"venta":"ventas"} por producto agotado (≈ ${money(Object.entries(lb).reduce((a,[p,q])=>a+q*config.prices[p],0))})`,p:`La más pedida sin stock fue ${P(top[0]).name} (${top[1]}). Hornea más de ese sabor o prepara una tanda antes de la hora fuerte.`})}}
  if(period==="hoy"&&!demo){const pj=projection();if(pj&&pj.val<config.goal)R.push({c:"var(--naranja)",e:"📊",t:`Vas camino a cerrar en ${money(pj.val)}, bajo la meta de ${money(config.goal)}`,p:`Faltarían ${money(config.goal-pj.val)}. Ofrece el combo en caja y publica en redes antes de la próxima hora fuerte.`})}
  if(!cur.tickets){R.push({c:"var(--chispa)",e:"🥟",t:"Todavía no hay ventas en este periodo",p:"Registra ventas en Vender y aquí verás qué hornear, a qué hora y qué empujar."});return R}
  const ranked=EMP.map(f=>({...f,q:cur.by[f.id]})).sort((a,b)=>b.q-a.q);
  const top=ranked[0],low=ranked[ranked.length-1];
  const share=q=>cur.u?Math.round(q/cur.u*100):0;
  const h=hours(list);const ph=h.indexOf(Math.max(...h));
  if(h[ph]>0){const days=period==="hoy"?1:period==="7"?7:30;R.push({c:"var(--brasa)",e:"🔥",t:`Tu hora fuerte es de ${ph}:00 a ${ph+1}:00`,p:`Ten la vitrina llena a las ${Math.max(0,ph-1)}:30. Salen unas ${Math.ceil(h[ph]/days)} empanadas por día en esa hora.`})}
  const k=kitchen(list);
  if(k.n>=3){
    if(k.avgTotal>config.target*60000) R.push({c:"var(--brasa)",e:"⏱️",t:`Los pedidos tardan ${mmss(k.avgTotal)} min en salir`,p:`Tu meta es ${config.target} min. ${k.late} pedidos se pasaron. Deja empanadas listas en la vitrina antes de la hora fuerte.`});
    else R.push({c:"var(--good)",e:"⏱️",t:`La cocina va bien: ${mmss(k.avgTotal)} min por pedido`,p:`Dentro de tu meta de ${config.target} min.`});
    if(k.cooks.length>1&&k.cooks[0].n>=3) R.push({c:"var(--good)",e:"🏅",t:`${esc(k.cooks[0].name)} es quien prepara más rápido (${mmss(k.cooks[0].avgPrep)} min)`,p:`Ponle en el turno de la hora fuerte y que comparta su método con el equipo.`});
  }
  R.push({c:top.c,e:"⭐",t:`${top.name} es tu favorita (${share(top.q)}% de las empanadas)`,p:"Que nunca falte en la vitrina. Si se agota, estás dejando ventas en la mesa."});
  if(cur.u&&low.q/cur.u<.12) R.push({c:"var(--naranja)",e:"📉",t:`${low.name} se mueve poco (${share(low.q)}%)`,p:`Hornea menos o súmala a un combo con ${top.name} para darla a probar.`});
  if(cur.drinkRate<.5){const tb=BEB.map(f=>({...f,q:cur.by[f.id]})).sort((a,b)=>b.q-a.q)[0];R.push({c:"#A0204C",e:"🥤",t:`Solo ${Math.round(cur.drinkRate*100)}% de los pedidos lleva bebida`,p:`Pregunta siempre al cobrar: "¿Le agrego una ${tb.q?tb.name:"Jamaica con piña"}?" Cada bebida suma ${money(config.prices.jamaica)}.`})}
  if(cur.avgU<2.2) R.push({c:"var(--chispa)",e:"🧃",t:`Cada cliente lleva ${cur.avgU.toFixed(1)} empanadas en promedio`,p:"Ofrece un combo de 3 empanadas + bebida para subir el ticket."});
  if(period==="hoy"){const falta=config.goal-cur.rev;
    if(falta>0)R.push({c:"var(--pared)",e:"🎯",t:`Faltan ${money(falta)} para tu meta de hoy`,p:`Son unas ${Math.ceil(falta/1.5)} empanadas o bebidas más.`});
    else R.push({c:"var(--good)",e:"🏆",t:"Meta del día cumplida",p:`Vas ${money(-falta)} por encima.`})}
  const mg=EMP.map(p=>({...p,m:config.prices[p.id]?(config.prices[p.id]-config.costs[p.id])/config.prices[p.id]:0,q:cur.by[p.id]})).filter(p=>p.q).sort((a,b)=>a.m-b.m);
  if(mg.length&&mg[0].m<.45&&mg[0].q/Math.max(1,cur.u)>=.15)R.push({c:"var(--naranja)",e:"💲",t:`${mg[0].name} vende bien pero deja poco margen (${Math.round(mg[0].m*100)}%)`,p:`Subir ${money(.25)} su precio sumaría ≈ ${money(.25*mg[0].q)} en este periodo, o revisa su costo.`});
  if(period!=="hoy"){const w=weekdayAvg(list);const v=w.filter(x=>x.n);if(v.length>=5){const lo=v.reduce((a,b)=>b.avg<a.avg?b:a),hi=v.reduce((a,b)=>b.avg>a.avg?b:a);
    if(lo.avg<hi.avg*.75)R.push({c:"var(--naranja)",e:"📅",t:`El ${lo.name} es tu día más flojo (${money(lo.avg)} vs. ${money(hi.avg)} el ${hi.name})`,p:"Haz una promo solo ese día, por ejemplo 2x1 en bebidas o combo especial, y mide el resultado la semana siguiente."})}}
  if(prev.rev>0){const ch=(cur.rev-prev.rev)/prev.rev*100;
    if(ch<=-10)R.push({c:"var(--brasa)",e:"⚠️",t:`Ventas ${Math.round(-ch)}% abajo vs. el periodo anterior`,p:"Revisa si faltó producto en la hora fuerte o haz una promo en redes."});
    else if(ch>=10)R.push({c:"var(--good)",e:"📈",t:`Ventas ${Math.round(ch)}% arriba vs. el periodo anterior`,p:"Sube un poco la producción para no quedarte corto."})}
  return R.slice(0,8);
}
const WD=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function weekdayAvg(list){const sum=Array(7).fill(0),days=Array(7).fill(null).map(()=>new Set());list.forEach(s=>{const d=new Date(payT(s));sum[d.getDay()]+=s.total;days[d.getDay()].add(dkey(payT(s)))});return sum.map((v,i)=>({i,name:WD[i],n:days[i].size,avg:days[i].size?v/days[i].size:0}))}
function productionPlan(all){
  const s=dayStart()-7*DAY,e=dayStart();const list=all.filter(x=>x.t>=s&&x.t<e&&!x.void);
  const days=new Set(list.map(x=>dayStart(new Date(x.t)))).size;if(!days)return null;
  const st=stats(list);return EMP.map(f=>({...f,q:Math.ceil(st.by[f.id]/days*1.1)}));
}

    `💵 Ventas: ${money(st.rev)} (${st.tickets} ${st.tickets===1?"pedido":"pedidos"})`,
    `🎟️ Ticket promedio: ${money(st.avgT)}`,
    `🥟 Empanadas: ${st.u}  |  🥤 Bebidas: ${st.b}`,
    `📈 Ganancia estimada: ${money(st.profit)}`];

  if(M.total>=9e5)L.push(`👥 Horas hombre: ${hdec(M.total)} h (${money(st.rev/(M.total/36e5))} por hora)`);

  if(oa.length)L.push(`⚠️ Cuentas sin cobrar: ${oa.length} por ${money(oa.reduce((a,x)=>a+acctTotal(x.id),0))}`);
  return L.join("\n");
}

/* ---------- Eventos ---------- */
document.addEventListener("keydown",e=>{if(!$("#askBox").hidden){if(e.key==="Escape")askDone($("#askIn").hidden?false:null);if(e.key==="Enter")$("#askYes").click();return}if(e.key==="Enter"&&e.target.id==="acctName")$("#createAcct").click();if(e.key==="Escape"&&!$("#modal").hidden)closePreview();if(e.key==="Enter"&&e.target.id==="pin")tryLogin();if(e.key==="Enter"&&(e.target.id==="aemail"||e.target.id==="apass"))authLogin();if(e.key==="Enter"&&e.target.id==="nc")$("#createKeys")?.click();if(e.key==="Enter"&&e.target.id==="newStaff")$("#addStaff").click();if(e.key==="Enter"&&e.target.id==="newCook")$("#addCook").click()});
document.addEventListener("change",async e=>{
  if(e.target.id!=="restore"||db||!isAdmin())return;const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(String(d.app).toLowerCase()!=="empanadictos")throw 0;
    if(Array.isArray(d.ventas)){d.sales=d.ventas;d.exported=Date.parse(d.fecha)||Date.now();d.inv=d.inventario;
      if(Array.isArray(d.cierres)){const m={};d.cierres.forEach(c=>{const{id,...v}=c;m[id]=v});d.cierres=m}}
    if(!Array.isArray(d.sales))throw 0;
    if(!await ask(`Restaurar la copia del ${new Date(d.exported).toLocaleString("es")}? Reemplaza todos los datos actuales de este navegador.`,{ok:"Restaurar",danger:true}))return;
    config=mergeCfg(d.config);sales=d.sales||[];cierres=d.cierres||{};inv=d.inv||inv;claves=d.claves||claves;turnos=d.turnos||[];cuentas=d.cuentas||[];perdidas=d.perdidas||[];saveLocal();toast("Copia restaurada");restoreSession();render()}
  catch(err){toast("Ese archivo no es una copia válida de la app",true)}
  e.target.value="";
});
document.addEventListener("input",e=>{
  if(e.target.id==="client")client=e.target.value;
  if(["pin","nv","nc","kv","kc"].includes(e.target.id))e.target.value=e.target.value.replace(/\D/g,"");
  if(DEC_IDS.includes(e.target.id)||e.target.dataset.price!==undefined||e.target.dataset.cost!==undefined){const v=e.target.value,c=v.replace(/[^\d.,]/g,"");if(c!==v)e.target.value=c}
  if(e.target.id==="fondo"||e.target.id==="contado"){const k=dkey(cajaDay);cajaDraft[k]={...(cajaDraft[k]||{}),[e.target.id]:e.target.value};updateCuadre()}
  if(e.target.id==="recv"){received=e.target.value;const tot=acctTotal(acct);const r=numIn(received);const v=r-tot;$("#vuelto").innerHTML=received!==""&&!isNaN(r)?(v>=0?`<span class="m">Vuelto</span><div class="change">${money(v)}</div>`:`<b class="down">Faltan ${money(-v)}</b>`):""}
});
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b||b.disabled)return;
  if(b.id==="askYes"){askDone($("#askIn").hidden?true:$("#askIn").value.trim());return}
  if(b.id==="askNo"){askDone($("#askIn").hidden?false:null);return}
  if(b.id==="share"){onShare(b);return}
  if(b.id==="closeModal"){closePreview();return}
  if(b.id==="pdf"){makePdf(b);return}
  if(b.id==="logout"){logout();return}
  if(b.id==="minsBtn"){showMins=!showMins;render();return}
  if(b.id==="notifOn"){try{await Notification.requestPermission()}catch(e){}render();return}
  if(b.id==="saveMins"){if(!isAdmin())return;const mins={};document.querySelectorAll("[data-min]").forEach(i=>{mins[i.dataset.min]=Math.max(0,parseInt(i.value,10)||0)});
    config.mins={...config.mins,...mins};config.alertPhone=$("#alertPhone").value.trim().slice(0,20);config.alertHour=$("#alertHour").value||"";
    try{await saveConfig();lastLows=null;checkLowAlerts();toast("Mínimos y alertas guardados")}catch(e){toast("No se pudo guardar",true)}showMins=false;render();return}
  if(b.id==="bkJson"){makeBackup("json",b);return}
  if(b.id==="bkXlsx"){makeXlsx(b);return}
  if(b.id==="npOpen"){addProd=true;renderSettings();setTimeout(()=>{const a=document.activeElement;if(!a||a===document.body||a.id==="npOpen")$("#npName")?.focus()},50);return}
  if(b.id==="npCancel"){addProd=false;renderSettings();return}
  if(b.id==="npSave"){if(!isAdmin()){toast("Solo un administrador puede hacer esto",true);return}
    const name=$("#npName").value.trim();if(!name){toast("Escribe el nombre del producto",true);return}
    if(PRODUCTS.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast("Ya existe un producto con ese nombre",true);return}
    const k=$("#npType").value,price=numIn($("#npPrice").value),cost=numIn($("#npCost").value)||0,qty=Math.max(0,parseInt($("#npQty").value,10)||0);
    if(!(price>0)){toast("Escribe el precio de venta",true);return}
    const id=name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"").slice(0,12)+"_"+Date.now().toString(36).slice(-4);
    const list=[...PRODUCTS,{id,name,c:$("#npColor").value||"#D62839",k,hidden:false}];
    config.products=list;setProducts(list);config.prices[id]=Math.round(price*100)/100;config.costs[id]=Math.round(cost*100)/100;config.mins[id]=k==="emp"?10:6;
    try{await saveConfig();await setStock({[id]:qty});addProd=false;toast(name+" agregado");render()}catch(e){toast("No se pudo guardar el producto",true)}
    return}
  if(b.dataset.hide){if(!isAdmin()){toast("Solo un administrador puede hacer esto",true);return}
    const p=PRODUCTS.find(x=>x.id===b.dataset.hide);if(!p)return;
    if(!p.hidden&&VIS.filter(x=>x.k===p.k).length<=1&&p.k!=="otro"&&!await ask(`${p.name} es el único producto de su tipo a la venta. ¿Ocultarlo igual?`,{ok:"Ocultar"}))return;
    p.hidden=!p.hidden;for(const id in cart)if(P(id).hidden)delete cart[id];setProducts(PRODUCTS);config.products=PRODUCTS;
    try{await saveConfig();toast(p.hidden?p.name+" oculto":p.name+" visible otra vez");render()}catch(e){toast("No se pudo guardar",true)}
    return}
  if(b.id==="authEnter"){authLogin();return}
  if(b.id==="authReset"){authReset();return}
  if(b.id==="authOut"){if(await ask("¿Cerrar la sesión segura de este dispositivo? Tendrás que volver a escribir el correo y la contraseña.",{ok:"Cerrar sesión",danger:true})){if(shiftId)await endShift(shiftId);try{ssDel()}catch(e){}await firebase.auth().signOut()}return}
  if(b.dataset.me!==undefined&&pendingRole){setSession(pendingRole,b.dataset.me);toast("Hola, "+b.dataset.me);render();window.scrollTo(0,0);return}
  if(b.id==="backLogin"){pendingRole=null;renderGate();return}
  if(b.dataset.login){loginRole=b.dataset.login;renderGate();return}
  if(b.id==="enter"){tryLogin();return}
  if(b.id==="createKeys"){
    const v=$("#nv").value,c=$("#nc").value,err=$("#err");
    if(!/^\d{4,8}$/.test(v)||!/^\d{4,8}$/.test(c)){err.textContent="Cada clave debe tener de 4 a 8 números";return}
    if(v===c){err.textContent="Las dos claves deben ser distintas";return}
    const adm=($("#adm").value||"").trim().slice(0,30);if(!adm){err.textContent="Escribe tu nombre";return}
    try{config.staff=[{name:adm,rol:"admin"},...config.staff.filter(x=>x.name!=="Administrador"&&x.name!==adm)];await saveConfig();
      await saveClaves({ventas:await hashPin("ventas",v),cocina:await hashPin("cocina",c)});setSession("ventas",adm);toast("Claves guardadas");render()}catch(e){err.textContent="No se pudieron guardar las claves"}
    return;
  }
  if(b.id==="saveKeys"){if(!isAdmin()){toast("Solo un administrador puede hacer esto",true);return}
    if(role!=="ventas")return;
    const v=$("#kv").value,c=$("#kc").value;
    if((v&&!/^\d{4,8}$/.test(v))||(c&&!/^\d{4,8}$/.test(c))){toast("Cada clave debe tener de 4 a 8 números",true);return}
    if(!v&&!c){toast("Escribe al menos una clave nueva",true);return}
    if(v&&c&&v===c){toast("Las dos claves deben ser distintas",true);return}
    const n={...claves};if(v)n.ventas=await hashPin("ventas",v);if(c)n.cocina=await hashPin("cocina",c);
    try{await saveClaves(n);setSession("ventas",who,true);toast("Claves actualizadas. Los equipos con la clave anterior deben volver a entrar.");renderSettings()}catch(e){toast("No se pudieron guardar",true)}
    return;
  }
  if(role!=="ventas"&&!b.dataset.start&&!b.dataset.ready&&!b.dataset.deliver&&b.dataset.cook===undefined)return;
  if(role!=="cocina"&&(b.dataset.start||b.dataset.ready||b.dataset.deliver))return;
  if(b.id==="addStaff"||b.id==="addCook"||b.dataset.rmstaff!==undefined||b.dataset.rmcook!==undefined){if(!isAdmin())return;
    if(b.id==="addStaff"){const n=$("#newStaff").value.trim().slice(0,30);if(!n){toast("Escribe un nombre",true);return}if(config.staff.some(x=>x.name.toLowerCase()===n.toLowerCase())){toast("Ese nombre ya existe",true);return}config.staff=[...config.staff,{name:n,rol:$("#newStaffRol").value}]}
    if(b.id==="addCook"){const n=$("#newCook").value.trim().slice(0,30);if(!n){toast("Escribe un nombre",true);return}if(config.cooks.some(x=>x.toLowerCase()===n.toLowerCase())){toast("Ese nombre ya existe",true);return}config.cooks=[...config.cooks,n]}
    if(b.dataset.rmstaff!==undefined){if(config.staff.length<=1){toast("Debe quedar al menos una persona en caja",true);return}const x=config.staff[+b.dataset.rmstaff];if(x.rol==="admin"&&config.staff.filter(s=>s.rol==="admin").length<=1){toast("Debe quedar al menos un administrador",true);return}if(!await ask("¿Quitar a "+x.name+"?"))return;config.staff=config.staff.filter((_,i)=>i!==+b.dataset.rmstaff)}
    if(b.dataset.rmcook!==undefined){if(config.cooks.length<=1){toast("Debe quedar al menos un cocinero",true);return}const x=config.cooks[+b.dataset.rmcook];if(!await ask("¿Quitar a "+x+"?"))return;config.cooks=config.cooks.filter((_,i)=>i!==+b.dataset.rmcook)}
    try{await saveConfig();toast("Equipo actualizado")}catch(e){toast("No se pudo guardar",true)}
    renderSettings();return;
  }
  if(b.dataset.tab){if(b.dataset.tab!=="vender")charging=false;tab=b.dataset.tab;if(tab==="cocina")seenPending=new Set(sales.filter(s=>s.status==="pendiente").map(s=>s.id));render();window.scrollTo(0,0);return}
  if(b.dataset.add){const id=b.dataset.add;if((cart[id]||0)>=stock(id)){
      const ok=await ask(stock(id)>0?`Solo quedan ${stock(id)} de ${P(id).name} y ya están en este pedido. ¿El cliente pidió más? Se registra como venta perdida.`:`${P(id).name} está agotada. ¿El cliente la pidió? Se registra como venta perdida para planear mejor la producción.`,{ok:"Registrar venta perdida"});
      if(ok){const r={t:Date.now(),p:id,by:who||""};try{if(db)await db.collection("perdidas").add(r);else{r.id="p"+r.t;perdidas.unshift(r);saveLocal()}toast("Venta perdida registrada")}catch(e){}}
      return}cart[id]=(cart[id]||0)+1;renderSell();return}
  if(b.dataset.minus){const k=b.dataset.minus;cart[k]--;if(cart[k]<=0)delete cart[k];renderSell();return}
  if(b.dataset.pay){pay=b.dataset.pay;renderPaybar();return}
  if(b.dataset.acct!==undefined){const next=b.dataset.acct||null;
    if(next!==acct&&Object.keys(cart).length&&!await ask("Tienes productos sin enviar en el pedido actual. ¿Cambiar de cuenta y descartarlos?",{ok:"Descartar",danger:true}))return;
    if(next!==acct)cart={};acct=next;charging=false;newAcct=false;received="";renderSell();window.scrollTo(0,0);return}
  if(b.id==="newAcct"){newAcct=true;renderSell();setTimeout(()=>$("#acctName")?.focus(),30);return}
  if(b.id==="cancelAcct"){newAcct=false;renderSell();return}
  if(b.id==="createAcct"){const n=($("#acctName").value||"").trim().slice(0,30);
    if(!n){toast("Escribe el nombre o la mesa",true);return}
    if(openAccts().some(c=>c.name.toLowerCase()===n.toLowerCase())){toast(`Ya hay una cuenta abierta "${n}". Usa otro nombre.`,true);return}
    b.disabled=true;try{const id=await addCuenta({name:n,status:"abierta",tOpen:Date.now(),openedBy:who||""});acct=id;newAcct=false;toast(`Cuenta "${n}" abierta`)}catch(e){toast("No se pudo abrir la cuenta",true)}
    renderSell();return}
  if(b.id==="sendAcct"){const c=cuentas.find(x=>x.id===acct);if(!c)return;
    const falta=shortfalls(cart);if(falta.length){falta.forEach(f=>{if(f.s>0)cart[f.id]=f.s;else delete cart[f.id]});render();toast("No hay inventario suficiente: "+falta.map(f=>`${P(f.id).name} (quedan ${f.s})`).join(", ")+". Ajusté el pedido.",true);return}
    const items={...cart};const total=cartTotal();const t=Date.now();const num=nextNum();const hasEmp=config.comanda&&Object.keys(items).some(f=>P(f).k==="emp");
    b.disabled=true;
    try{await addSale({t,num,items,total,pay:null,paid:false,tPaid:null,paidBy:"",cuenta:c.id,ronda:acctOrders(c.id).length+1,cashier:who||"",client:c.name,status:hasEmp?"pendiente":"entregado",cook:null,tStart:null,tReady:null,tDone:hasEmp?null:t});
      cart={};toast(`Agregado a ${c.name}: ${money(total)}`+(hasEmp?", enviado a cocina":""))}catch(e){toast("No se pudo guardar. Intenta de nuevo.",true)}
    render();return}
  if(b.id==="toggleComanda"){const on=!config.comanda;
    const q=sales.filter(s=>!s.void&&["pendiente","preparando","listo"].includes(s.status)).length;
    if(!await ask(on?"¿Activar el modo comanda? Los pedidos con empanadas se enviarán a la pantalla de Cocina.":`¿Apagar el modo comanda? Las ventas nuevas se registrarán como entregadas sin pasar por Cocina.${q?` Los ${q} pedidos que ya están en cocina siguen allí.`:""}`,{ok:on?"Activar":"Apagar"}))return;
    config.comanda=on;try{await saveConfig();toast(on?"Modo comanda activado":"Modo comanda apagado")}catch(e){toast("No se pudo guardar",true)}render();return}
  if(b.id==="chargeAcct"){if(Object.keys(cart).length){toast("Primero envía o quita los productos del pedido actual",true);return}charging=true;received="";render();window.scrollTo(0,0);return}
  if(b.id==="backCharge"){charging=false;render();return}
  if(b.dataset.cpay){pay=b.dataset.cpay;renderCharge();return}
  if(b.id==="confirmPay"){const c=cuentas.find(x=>x.id===acct);if(!c)return;const ords=acctOrders(c.id);const tot=acctTotal(c.id);const now=Date.now();
    b.disabled=true;
    try{for(const s of ords){if(s.paid===false)await patchSale(s.id,{paid:true,pay,tPaid:now,paidBy:who||""})}
      await patchCuenta(c.id,{status:"cobrada",tClosed:now,pay,total:tot,paidBy:who||""});
      toast(`Cuenta de ${c.name} cobrada: ${money(tot)}`);acct=null;charging=false;received=""}
    catch(e){toast("No se completó el cobro. Revisa la cuenta e intenta de nuevo.",true);b.disabled=false}
    render();window.scrollTo(0,0);return}
  if(b.id==="voidAcct"){const c=cuentas.find(x=>x.id===acct);if(!c)return;const ords=acctOrders(c.id);const tot=acctTotal(c.id);
    const reason=await ask(ords.length?`Anular la cuenta de ${c.name} por ${money(tot)}. El producto ya entregado se registrará como pérdida. Escribe el motivo:`:`¿Anular la cuenta vacía de ${c.name}?`,{input:!!ords.length,placeholder:"Ej. Cliente se fue sin pagar",ok:"Anular",danger:true});
    if(reason===null||reason===false)return;
    try{for(const s of ords)await patchSale(s.id,{void:true,paid:false,voidReason:reason===true?"":reason,voidBy:who||"",tVoid:Date.now(),status:s.status==="entregado"?"entregado":"anulado"});
      await patchCuenta(c.id,{status:"anulada",tClosed:Date.now(),reason:reason===true?"":reason,voidTotal:tot,voidBy:who||""});
      toast("Cuenta anulada");acct=null;charging=false}catch(e){toast("No se pudo anular",true)}
    render();return}
  if(b.id==="cobrar"){
    const falta=shortfalls(cart);if(falta.length){falta.forEach(f=>{if(f.s>0)cart[f.id]=f.s;else delete cart[f.id]});render();toast("No hay inventario suficiente: "+falta.map(f=>`${P(f.id).name} (quedan ${f.s})`).join(", ")+". Ajusté el pedido.",true);return}
    const items={...cart};const total=Math.round(Object.entries(items).reduce((a,[f,q])=>a+q*config.prices[f],0)*100)/100;
    const t=Date.now();const num=nextNum();
    const hasEmp=config.comanda&&Object.keys(items).some(f=>P(f).k==="emp");
    b.disabled=true;
    try{await addSale({t,num,items,total,pay,paid:true,tPaid:t,paidBy:who||"",cuenta:null,cashier:who||"",client:client.trim().slice(0,40),status:hasEmp?"pendiente":"entregado",cook:null,tStart:null,tReady:null,tDone:hasEmp?null:t});
      cart={};client="";toast(`Pedido #${num} registrado: ${money(total)}`+(hasEmp?", enviado a cocina":""));}
    catch(e){toast("No se pudo guardar. Intenta de nuevo.",true)}
    render();return;
  }
  if(b.dataset.del){if(!isAdmin())return;const s=sales.find(x=>x.id===b.dataset.del);if(!s)return;
    const r=await ask(`Anular el pedido #${s.num||""} de ${money(s.total)}. ${s.tStart?"Ya se preparó, así que el inventario no se devuelve.":"No se alcanzó a preparar, así que vuelve al inventario."} Escribe el motivo:`,{input:true,placeholder:"Ej. Error al registrar",ok:"Anular",danger:true});
    if(r===null)return;
    try{await patchSale(s.id,{void:true,voidReason:r,voidBy:who||"",tVoid:Date.now(),status:s.status==="entregado"?"entregado":"anulado"});toast("Venta anulada")}catch(e){toast("No se pudo anular",true)}
    render();return}
  if(b.dataset.cook!==undefined){myCook=b.dataset.cook;try{localStorage.setItem("emp_cook",myCook)}catch(e){}renderKitchen();return}
  if(b.dataset.start){if(!myCook){toast("Primero elige quién cocina",true);return}await patchSale(b.dataset.start,{status:"preparando",cook:myCook,tStart:Date.now()}).catch(()=>toast("No se pudo actualizar",true));render();return}
  if(b.dataset.ready){await patchSale(b.dataset.ready,{status:"listo",tReady:Date.now()}).catch(()=>toast("No se pudo actualizar",true));render();return}
  if(b.dataset.deliver){await patchSale(b.dataset.deliver,{status:"entregado",tDone:Date.now()}).catch(()=>toast("No se pudo actualizar",true));render();return}
  if(b.dataset.invset&&!isAdmin()){toast("Solo un administrador puede ajustar el conteo",true);return}
  if(b.dataset.invadd||b.dataset.invset){
    const id=b.dataset.invadd||b.dataset.invset;const v=parseInt(document.querySelector(`[data-invq="${id}"]`).value,10);
    if(isNaN(v)||v<0){toast("Escribe una cantidad",true);return}
    await setStock({[id]:b.dataset.invadd?stock(id)+v:v}).catch(()=>toast("No se pudo guardar",true));
    toast(`${P(id).name}: ${stock(id)} unidades`);render();return;
  }
  if(b.id==="refill"){if(!isAdmin()){toast("Solo un administrador puede hacer esto",true);return}if(!await ask(`¿Poner todos los productos en ${config.stockMax} unidades?`))return;await setStock(Object.fromEntries(VIS.map(p=>[p.id,config.stockMax]))).catch(()=>toast("No se pudo guardar",true));toast("Inventario repuesto");render();return}
  if(b.dataset.day){cajaDay+=Number(b.dataset.day)*DAY;cajaDay=dayStart(new Date(cajaDay+36e5*3));renderCaja();return}
  if(b.id==="cerrar"){
    const {st}=dayData(cajaDay);const fondo=numIn($("#fondo").value)||0;const cv=$("#contado").value.trim();
    if(cv===""||isNaN(numIn(cv))){toast("Escribe el efectivo contado",true);return}
    const contado=numIn(cv)||0;const esperado=fondo+st.cash;
    const oa=cajaDay===dayStart()?openAccts():[];const oaTot=oa.reduce((a,c)=>a+acctTotal(c.id),0);
    if(oa.length&&!await ask(`Hay ${oa.length} ${oa.length===1?"cuenta":"cuentas"} sin cobrar por ${money(oaTot)}. No se sumarán a este cierre. ¿Cerrar la caja de todos modos?`,{ok:"Cerrar igual",danger:true}))return;
    const rec={fecha:dkey(cajaDay),closedBy:who||"",fondo,contado,efectivo:st.cash,transferencias:st.rev-st.cash,ventas:st.rev,pedidos:st.tickets,empanadas:st.u,bebidas:st.b,esperado,diferencia:Math.round((contado-esperado)*100)/100,closedAt:Date.now(),pendientes:oa.length,pendienteMonto:Math.round(oaTot*100)/100};
    try{await saveCierre(rec.fecha,rec);toast("Caja cerrada");}catch(e){toast("No se pudo guardar el cierre",true)}
    renderCaja();return;
  }
  if(b.id==="preview"){openPreview();return}
  if(b.dataset.endshift){if(!isAdmin()){toast("Solo un administrador puede hacer esto",true);return}const t=turnos.find(x=>x.id===b.dataset.endshift);if(!await ask(`¿Cerrar ahora el turno de ${t?t.name:"esta persona"}?`))return;await endShift(b.dataset.endshift);toast("Turno cerrado");render();return}
  if(b.id==="dlcsv"){download(`ventas-empanadictos-${dkey(cajaDay)}.csv`,csvFor(cajaDay),"text/csv");return}
  if(b.dataset.period){period=b.dataset.period;renderAnalysis();return}
  if(b.id==="demoOn"){demo=true;demoSales=null;demoShifts=null;renderAnalysis();return}
  if(b.id==="demoOff"){demo=false;renderAnalysis();return}
  if(b.id==="demoToggle"){demo=!demo;demoSales=null;demoShifts=null;tab="analisis";render();return}
  if(b.id==="saveCfg"){if(!isAdmin()){toast("Solo un administrador puede hacer esto",true);return}
    document.querySelectorAll("[data-price]").forEach(i=>config.prices[i.dataset.price]=Math.max(0,numIn(i.value)||0));
    document.querySelectorAll("[data-cost]").forEach(i=>config.costs[i.dataset.cost]=Math.max(0,numIn(i.value)||0));
    document.querySelectorAll("[data-pname]").forEach(i=>{const p=PRODUCTS.find(x=>x.id===i.dataset.pname),v=i.value.trim();if(p&&v)p.name=v});config.products=PRODUCTS;
    config.goal=Math.max(0,numIn($("#goal").value)||0);
    config.target=Math.max(1,parseFloat($("#target").value)||8);
    config.stockMax=Math.max(1,parseInt($("#stockMax").value,10)||50);
    demoSales=null;
    try{await saveConfig();toast("Ajustes guardados")}catch(e){toast("No se pudo guardar",true)}
    return;
  }
  if(b.id==="wipe"){if(!isAdmin()){toast("Solo un administrador puede hacer esto",true);return}
    if(!await ask("Se borrarán todas las ventas, cuentas y ventas perdidas. Descarga antes una copia si la necesitas. ¿Continuar?",{ok:"Borrar todo",danger:true}))return;
    if(db){for(const s of[...sales]){try{await db.collection("ventas").doc(s.id).delete()}catch(e){}}for(const c of[...cuentas]){try{await db.collection("cuentas").doc(c.id).delete()}catch(e){}}}else{sales=[];cuentas=[];perdidas=[];saveLocal()}acct=null;charging=false;
    toast("Ventas borradas");render();
  }
});
setInterval(checkDailyReview,30000);setTimeout(checkDailyReview,5000);
setInterval(()=>{
  if(tab!=="cocina")return;const now=Date.now();
  document.querySelectorAll("[data-since]").forEach(el=>{const ms=now-Number(el.dataset.since);el.textContent=mmss(ms);const t=el.closest(".ticket");t.classList.remove("ok","mid","late");t.classList.add(tClass(ms))});
},1000);
render();
</script>
</body>
</html>
